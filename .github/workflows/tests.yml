name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            django: '>=5.2.19,<5.3'
          - python: '3.11'
            django: '>=5.2.19,<5.3'
          - python: '3.12'
            django: '>=5.2.19,<5.3'
          - python: '3.12'
            django: '>=6.0.10,<6.1'
          - python: '3.12'
            django: '>=6.1.3,<6.2'
          - python: '3.13'
            django: '>=5.2.19,<5.3'
          - python: '3.13'
            django: '>=6.1.3,<6.2'
          - python: '3.14'
            django: '>=5.2.19,<5.3'
          - python: '3.14'
            django: '>=6.0.10,<6.1'
          - python: '3.14'
            django: '>=6.1.3,<6.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . "Django${{ matrix.django }}"
      - run: python manage.py test django_sonar
      - run: python manage.py makemigrations --check --dry-run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip_audit -r requirements.txt

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          required = ('/templates/', '/static/', '/migrations/')
          missing = [path for path in required if not any(path in name for name in names)]
          if missing:
              raise SystemExit(f'Missing packaged paths: {missing}')
          if any(name.endswith('.DS_Store') for name in names):
              raise SystemExit('Wheel contains a .DS_Store file')
          PY
