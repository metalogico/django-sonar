[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=84.1.0",
  "wheel",
  "setuptools-scm>=6.2",
]

[project]
name = "django_sonar"
description = "The missing debug tool for Django, inspired by Telescope."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Metalogico", email = "michele.brandolin@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = [
  # Security baselines: 5.2.19, 6.0.10, and 6.1.3 (November 2026).
  "Django>=5.2.19,<6.2,!=6.0.0,!=6.0.1,!=6.0.2,!=6.0.3,!=6.0.4,!=6.0.5,!=6.0.6,!=6.0.7,!=6.0.8,!=6.0.9,!=6.1.0,!=6.1.1,!=6.1.2",
  "sqlparse>=0.6.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["django_sonar*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "django_sonar.VERSION"}

[project.urls]
Homepage = "https://github.com/metalogico/django-sonar"
Issues = "https://github.com/metalogico/django-sonar/issues"
Download = "https://pypi.org/project/django-sonar/"
